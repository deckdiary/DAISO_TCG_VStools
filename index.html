<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1216">
<title>対戦カウンター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1216;
  --panel:#1A1F26;
  --panel2:#232A33;
  --line:#333B46;
  --paper:#F5F2EA;
  --muted:#8A93A0;
  --verm:#D8342C;
  --red:#D8342C;
  --blue:#2F6FD8;
  --green:#2FA36B;
  --white:#EDE9DC;
  --black:#1E242E;
  --gray:#6E7684;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  height:100dvh;overflow:hidden;
  background:var(--ink);color:var(--paper);
  font-family:'Noto Sans JP',sans-serif;
  touch-action:manipulation;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{
  font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;
  touch-action:manipulation;
}
button:active{transform:scale(.97);}
input[type=number]{
  font-family:'Oswald',sans-serif;font-size:22px;font-weight:500;
  background:var(--panel);color:var(--paper);
  border:1px solid var(--line);border-radius:10px;
  width:70px;height:44px;text-align:center;
}
input[type=number]:focus{outline:2px solid var(--verm);}

/* ---------- views ---------- */
.view{display:none;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
.view.active{display:flex;}

/* ---------- top bar ---------- */
.topbar{
  flex:none;height:46px;display:flex;align-items:center;gap:10px;
  padding:0 12px;border-bottom:1px solid var(--line);
}
.backbtn{
  font-size:14px;font-weight:500;color:var(--muted);
  padding:8px 10px 8px 0;
}
.topbar h1{font-size:15px;font-weight:700;letter-spacing:.02em;}

/* ---------- home ---------- */
#home{justify-content:flex-start;}
.home-head{flex:none;padding:26px 20px 14px;}
.home-head .appname{font-size:30px;font-weight:700;line-height:1.2;}
.home-head .appsub{margin-top:6px;font-size:13px;color:var(--muted);}
.home-head .rule{margin-top:14px;height:3px;width:44px;background:var(--verm);}
.home-list{flex:1;display:flex;flex-direction:column;gap:10px;padding:8px 16px 16px;min-height:0;}
.home-list button{
  flex:1;min-height:0;text-align:left;padding:0 18px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
}
.home-list .mname{font-size:17px;font-weight:700;}
.home-list .mdesc{font-size:12px;color:var(--muted);}

/* ---------- shared counter pieces ---------- */
.stepbtn{
  font-family:'Oswald',sans-serif;font-weight:500;
  border-radius:12px;background:var(--panel2);
  display:flex;align-items:center;justify-content:center;
  color:var(--paper);
}
.bottombar{
  flex:none;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
}
.bottombar button{
  flex:1;height:52px;border-radius:12px;font-size:15px;font-weight:700;
  background:var(--panel);border:1px solid var(--line);
}
.bottombar button.accent{background:var(--verm);border-color:var(--verm);}
.bottombar button:disabled{opacity:.35;transform:none;}

/* ---------- 蟲神器 ---------- */
#mushiRows{flex:1;display:flex;flex-direction:column;gap:8px;padding:10px 12px;min-height:0;}
.mrow{
  flex:1;min-height:0;position:relative;display:flex;gap:8px;
  container-type:size;
}
.mrow .stepbtn{flex:0 0 24%;font-size:34px;font-size:min(15cqw,42cqh);}
.mrow .mval{
  flex:1;display:flex;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  font-family:'Oswald',sans-serif;font-weight:600;
  font-size:56px;font-size:min(24cqw,56cqh);
  font-variant-numeric:tabular-nums;
}
.mrow .mval.neg{color:#7FB2FF;}
.mrow .midx{
  position:absolute;top:6px;left:calc(24% + 16px);
  font-size:11px;color:var(--muted);pointer-events:none;
}
.mrow .mdel{
  position:absolute;top:4px;right:calc(24% + 12px);
  width:30px;height:30px;border-radius:50%;
  color:var(--muted);font-size:16px;line-height:30px;text-align:center;
}

/* ---------- 2P zone layout (イジンデン / 千怪戦戯) ---------- */
.zone{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 12px;}
.zone.flip{transform:rotate(180deg);}
.zone[hidden]{display:none;}
.zonebar{flex:none;display:flex;gap:8px;}
.zonebar button{
  flex:1;height:40px;border-radius:10px;font-size:13px;font-weight:700;
  background:var(--panel);border:1px solid var(--line);color:var(--muted);
}
.zonediv{flex:none;height:1px;background:var(--line);margin:0 12px;}

/* ---------- イジンデン ---------- */
.irow{
  flex:1;min-height:0;display:flex;gap:8px;position:relative;
  container-type:size;
}
.irow .stepbtn{flex:0 0 24%;font-size:30px;font-size:min(14cqw,38cqh);}
.irow .ibody{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:12px;border:1px solid;
}
.irow .ilabel{font-size:13px;font-size:min(5cqw,14cqh);font-weight:700;}
.irow .ival{
  font-family:'Oswald',sans-serif;font-weight:600;line-height:1;
  font-size:48px;font-size:min(20cqw,52cqh);
  font-variant-numeric:tabular-nums;color:var(--paper);
}
.irow.summon .ibody{background:rgba(216,52,44,.13);border-color:rgba(216,52,44,.55);}
.irow.summon .ilabel{color:#F0776F;}
.irow.place .ibody{background:rgba(47,163,107,.13);border-color:rgba(47,163,107,.55);}
.irow.place .ilabel{color:#5BC793;}

/* ---------- 千怪戦戯 ---------- */
.scount{
  flex:1;min-height:0;display:flex;gap:8px;container-type:size;
}
.scount .stepbtn{flex:0 0 24%;font-size:34px;font-size:min(15cqw,40cqh);background:rgba(0,0,0,.35);}
.scount .sval{
  flex:1;display:flex;align-items:center;justify-content:center;
  border-radius:14px;
  font-family:'Oswald',sans-serif;font-weight:600;
  font-size:64px;font-size:min(26cqw,60cqh);
  font-variant-numeric:tabular-nums;
  color:var(--paper);text-shadow:0 2px 10px rgba(0,0,0,.5);
  transition:background .2s;
}
.scount .sval.on-light{color:#1A1E24;text-shadow:none;}
.colorbar{flex:none;display:flex;justify-content:center;gap:14px;padding:2px 0;}
.colorbar button{
  width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);position:relative;
}
.colorbar button.sel{box-shadow:0 0 0 3px var(--paper);}

/* ---------- タイマー ---------- */
.tdisplay{
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  container-type:size;position:relative;
}
.tdisplay .ttime{
  font-family:'Oswald',sans-serif;font-weight:600;
  font-size:100px;font-size:min(30cqw,46cqh);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.tdisplay .ttime.warn{color:var(--verm);}
.tstate{position:absolute;bottom:12%;font-size:14px;color:var(--muted);}
.setrow{
  flex:none;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:6px 0;
}
.setrow .stepbtn{width:52px;height:44px;font-size:24px;}
.setrow .unit{font-size:14px;color:var(--muted);}
.setrow.disabled{opacity:.35;pointer-events:none;}

/* ---------- チェスクロック ---------- */
.czone{
  flex:1;min-height:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  container-type:size;position:relative;
  background:var(--panel);margin:8px 12px;border-radius:16px;
  border:2px solid var(--line);transition:border-color .15s,background .15s;
}
.czone.flip{transform:rotate(180deg);}
.czone.turn{border-color:var(--verm);background:#241A1B;}
.czone .ctime{
  font-family:'Oswald',sans-serif;font-weight:600;
  font-size:64px;font-size:min(26cqw,42cqh);
  font-variant-numeric:tabular-nums;
}
.czone.turn .ctime{color:var(--verm);}
.czone .chint{font-size:12px;font-size:min(4.5cqw,11cqh);color:var(--muted);}
.cmid{
  flex:none;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:2px 12px;
}
.cmid button{
  height:44px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:700;
  background:var(--panel);border:1px solid var(--line);
}
.cmid button.accent{background:var(--verm);border-color:var(--verm);}
.cmid .stepbtn{width:44px;height:44px;font-size:22px;padding:0;}
.cmid .unit{font-size:13px;color:var(--muted);}
.cmid .setgroup{display:flex;align-items:center;gap:6px;}
.cmid .setgroup.disabled{opacity:.35;pointer-events:none;}
#chessFischerRow{padding-top:0;}
#chessFischerRow input{width:58px;height:40px;font-size:18px;}
#chessFischer{color:var(--muted);}
#chessFischer.accent{color:var(--paper);}

/* ---------- flash ---------- */
.flash{
  position:absolute;inset:0;background:var(--verm);opacity:0;
  pointer-events:none;border-radius:inherit;z-index:40;
}
#screenFlash{position:fixed;inset:0;border-radius:0;z-index:60;}
@keyframes blink{0%,100%{opacity:0}50%{opacity:.72}}
@media (prefers-reduced-motion:reduce){
  .flash{animation-iteration-count:1 !important;}
  button:active{transform:none;}
}
</style>
</head>
<body>

<!-- ============ ホーム ============ -->
<div class="view active" id="home">
  <div class="home-head">
    <div class="appname">対戦カウンター</div>
    <div class="appsub">蟲神器 / イジンデン / 千怪戦戯 + タイマー・チェスクロック</div>
    <div class="rule"></div>
  </div>
  <div class="home-list">
    <button data-go="mushi">
      <span class="mname">蟲神器 バフカウンター</span>
      <span class="mdesc">0スタート・±100・最大6個まで追加</span>
    </button>
    <button data-go="ijin">
      <span class="mname">イジンデン 召喚権+配置権カウンター</span>
      <span class="mdesc">イジン召喚権・マリョク配置権 / 2Pモード対応</span>
    </button>
    <button data-go="senkai">
      <span class="mname">千怪戦戯 コストカウンター</span>
      <span class="mdesc">5色の色管理 / 2Pモード対応</span>
    </button>
    <button data-go="timer">
      <span class="mname">タイマー</span>
      <span class="mdesc">カウントダウン式・残り5分/3分/1分でお知らせ</span>
    </button>
    <button data-go="chess">
      <span class="mname">チェスクロック</span>
      <span class="mdesc">スマホを挟んで対面使用・フィッシャーモード対応</span>
    </button>
  </div>
</div>

<!-- ============ 蟲神器 ============ -->
<div class="view" id="mushi">
  <div class="topbar">
    <button class="backbtn" data-go="home">◀ 一覧</button>
    <h1>蟲神器 バフカウンター</h1>
  </div>
  <div id="mushiRows"></div>
  <div class="bottombar">
    <button id="mushiReset">全リセット</button>
    <button id="mushiAdd" class="accent">パラメーターを追加</button>
  </div>
</div>

<!-- ============ イジンデン ============ -->
<div class="view" id="ijin">
  <div class="topbar">
    <button class="backbtn" data-go="home">◀ 一覧</button>
    <h1>イジンデン 召喚権+配置権カウンター</h1>
  </div>

  <div class="zone flip" data-side="b" id="ijinB" hidden>
    <div class="irow summon">
      <button class="stepbtn" data-act="dec" data-k="0">−</button>
      <div class="ibody"><span class="ilabel">イジン召喚権</span><span class="ival" data-v="0">1</span></div>
      <button class="stepbtn" data-act="inc" data-k="0">＋</button>
    </div>
    <div class="irow place">
      <button class="stepbtn" data-act="dec" data-k="1">−</button>
      <div class="ibody"><span class="ilabel">マリョク配置権</span><span class="ival" data-v="1">1</span></div>
      <button class="stepbtn" data-act="inc" data-k="1">＋</button>
    </div>
    <div class="zonebar"><button data-act="zreset">リセット（両方1に戻す）</button></div>
  </div>

  <div class="zonediv" id="ijinDiv" hidden></div>

  <div class="zone" data-side="a" id="ijinA">
    <div class="irow summon">
      <button class="stepbtn" data-act="dec" data-k="0">−</button>
      <div class="ibody"><span class="ilabel">イジン召喚権</span><span class="ival" data-v="0">1</span></div>
      <button class="stepbtn" data-act="inc" data-k="0">＋</button>
    </div>
    <div class="irow place">
      <button class="stepbtn" data-act="dec" data-k="1">−</button>
      <div class="ibody"><span class="ilabel">マリョク配置権</span><span class="ival" data-v="1">1</span></div>
      <button class="stepbtn" data-act="inc" data-k="1">＋</button>
    </div>
    <div class="zonebar"><button data-act="zreset">リセット（両方1に戻す）</button></div>
  </div>

  <div class="bottombar">
    <button id="ijin2p">２Pモード</button>
  </div>
</div>

<!-- ============ 千怪戦戯 ============ -->
<div class="view" id="senkai">
  <div class="topbar">
    <button class="backbtn" data-go="home">◀ 一覧</button>
    <h1>千怪戦戯 コストカウンター</h1>
  </div>

  <div class="zone flip" data-side="b" id="senkaiB" hidden>
    <div class="scount">
      <button class="stepbtn" data-act="dec">−</button>
      <div class="sval">1</div>
      <button class="stepbtn" data-act="inc">＋</button>
    </div>
    <div class="colorbar"></div>
    <div class="zonebar"><button data-act="zreset">リセット</button></div>
  </div>

  <div class="zonediv" id="senkaiDiv" hidden></div>

  <div class="zone" data-side="a" id="senkaiA">
    <div class="scount">
      <button class="stepbtn" data-act="dec">−</button>
      <div class="sval">1</div>
      <button class="stepbtn" data-act="inc">＋</button>
    </div>
    <div class="colorbar"></div>
    <div class="zonebar"><button data-act="zreset">リセット</button></div>
  </div>

  <div class="bottombar">
    <button id="senkai2p">２Pモード</button>
  </div>
</div>

<!-- ============ タイマー ============ -->
<div class="view" id="timer">
  <div class="topbar">
    <button class="backbtn" data-go="home">◀ 一覧</button>
    <h1>タイマー</h1>
  </div>
  <div class="tdisplay">
    <div class="ttime" id="timerTime">25:00</div>
    <div class="tstate" id="timerState"></div>
  </div>
  <div class="setrow" id="timerSet">
    <button class="stepbtn" data-act="min-dec">−</button>
    <input type="number" id="timerMin" min="1" max="180" value="25" inputmode="numeric">
    <span class="unit">分</span>
    <button class="stepbtn" data-act="min-inc">＋</button>
  </div>
  <div class="bottombar">
    <button id="timerToggle" class="accent">スタート</button>
    <button id="timerReset">リセット</button>
  </div>
</div>

<!-- ============ チェスクロック ============ -->
<div class="view" id="chess">
  <div class="topbar">
    <button class="backbtn" data-go="home">◀ 一覧</button>
    <h1>チェスクロック</h1>
  </div>

  <div class="czone flip" id="chessB">
    <div class="ctime">15:00</div>
    <div class="chint"></div>
    <div class="flash"></div>
  </div>

  <div class="cmid">
    <div class="setgroup" id="chessSet">
      <button class="stepbtn" data-act="min-dec">−</button>
      <input type="number" id="chessMin" min="1" max="180" value="15" inputmode="numeric">
      <span class="unit">分</span>
      <button class="stepbtn" data-act="min-inc">＋</button>
    </div>
    <button id="chessToggle" class="accent">スタート</button>
    <button id="chessReset">リセット</button>
  </div>

  <div class="cmid" id="chessFischerRow">
    <button id="chessFischer">フィッシャーモード</button>
    <div class="setgroup" id="chessIncSet" hidden>
      <span class="unit">加算</span>
      <input type="number" id="chessIncMin" min="0" max="30" value="0" inputmode="numeric"><span class="unit">分</span>
      <input type="number" id="chessIncSec" min="0" max="59" value="15" inputmode="numeric"><span class="unit">秒</span>
    </div>
  </div>

  <div class="czone" id="chessA">
    <div class="ctime">15:00</div>
    <div class="chint"></div>
    <div class="flash"></div>
  </div>
  <div style="flex:none;height:calc(8px + env(safe-area-inset-bottom));"></div>
</div>

<div class="flash" id="screenFlash"></div>

<script>
(()=>{
"use strict";
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];

/* ---------- 状態と保存 ---------- */
const KEY="taisenCounterV1";
const defaults={
  mushi:{counters:[0]},
  ijin:{p2:false,a:[1,1],b:[1,1]},
  senkai:{p2:false,a:{v:1,c:[]},b:{v:1,c:[]}},
  timer:{min:25},
  chess:{min:15,fischer:false,incMin:0,incSec:15}
};
let state;
try{
  const saved=JSON.parse(localStorage.getItem(KEY)||"{}");
  state={};
  for(const k in defaults)state[k]=Object.assign({},defaults[k],saved[k]);
}catch(e){state=JSON.parse(JSON.stringify(defaults));}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};

/* ---------- 画面切り替え ---------- */
let current="home";
function show(id){
  $$(".view").forEach(v=>v.classList.toggle("active",v.id===id));
  current=id;
  if(id==="home"){releaseWake();pauseTimer();pauseChess();}
  else{requestWake();}
}
document.body.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");
  if(go)show(go.dataset.go);
});

/* ---------- スリープ防止 ---------- */
let wake=null;
async function requestWake(){
  try{if(!wake&&"wakeLock"in navigator)wake=await navigator.wakeLock.request("screen");
      if(wake)wake.addEventListener("release",()=>{wake=null;});}
  catch(e){wake=null;}
}
function releaseWake(){if(wake){wake.release().catch(()=>{});wake=null;}}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&current!=="home")requestWake();
});

/* ---------- 点滅 ---------- */
function flash(el,times){
  el.style.animation="none";
  void el.offsetWidth;
  el.style.animation=`blink .5s ease ${times}`;
}
const screenFlash=$("#screenFlash");

/* ================= 蟲神器 ================= */
const MUSHI_MAX=6;
const mushiRows=$("#mushiRows");
function renderMushi(){
  const cs=state.mushi.counters;
  mushiRows.innerHTML=cs.map((v,i)=>`
    <div class="mrow">
      <button class="stepbtn" data-act="dec" data-i="${i}">−</button>
      <div class="mval ${v<0?"neg":""}">${v}</div>
      <span class="midx">${i+1}</span>
      ${cs.length>1?`<button class="mdel" data-act="del" data-i="${i}">✕</button>`:""}
      <button class="stepbtn" data-act="inc" data-i="${i}">＋</button>
    </div>`).join("");
  $("#mushiAdd").disabled=cs.length>=MUSHI_MAX;
  $("#mushiAdd").textContent=cs.length>=MUSHI_MAX?"パラメーター上限（6個）":"パラメーターを追加";
}
mushiRows.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const i=+b.dataset.i,cs=state.mushi.counters;
  if(b.dataset.act==="inc")cs[i]+=100;
  else if(b.dataset.act==="dec")cs[i]-=100;
  else if(b.dataset.act==="del")cs.splice(i,1);
  save();renderMushi();
});
$("#mushiAdd").addEventListener("click",()=>{
  if(state.mushi.counters.length<MUSHI_MAX){state.mushi.counters.push(0);save();renderMushi();}
});
$("#mushiReset").addEventListener("click",()=>{
  state.mushi.counters=state.mushi.counters.map(()=>0);save();renderMushi();
});

/* ================= イジンデン ================= */
function renderIjin(){
  const p2=state.ijin.p2;
  $("#ijinB").hidden=!p2;
  $("#ijinDiv").hidden=!p2;
  $("#ijin2p").textContent=p2?"２Pモード解除":"２Pモード";
  $("#ijin2p").classList.toggle("accent",p2);
  ["a","b"].forEach(side=>{
    const zone=$(`#ijin .zone[data-side="${side}"]`);
    $$(".ival",zone).forEach(el=>{el.textContent=state.ijin[side][+el.dataset.v];});
  });
}
$("#ijin").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const zone=b.closest(".zone");if(!zone)return;
  const side=zone.dataset.side,k=+b.dataset.k;
  if(b.dataset.act==="inc")state.ijin[side][k]++;
  else if(b.dataset.act==="dec")state.ijin[side][k]=Math.max(0,state.ijin[side][k]-1);
  else if(b.dataset.act==="zreset")state.ijin[side]=[1,1];
  save();renderIjin();
});
$("#ijin2p").addEventListener("click",()=>{
  state.ijin.p2=!state.ijin.p2;
  if(state.ijin.p2)state.ijin.b=[1,1];
  save();renderIjin();
});

/* ================= 千怪戦戯 ================= */
const SCOLORS=[
  {id:"red",  label:"赤",hex:"#D8342C"},
  {id:"blue", label:"青",hex:"#2F6FD8"},
  {id:"green",label:"緑",hex:"#2FA36B"},
  {id:"white",label:"白",hex:"#EDE9DC"},
  {id:"black",label:"黒",hex:"#1E242E"}
];
$$("#senkai .colorbar").forEach(bar=>{
  bar.innerHTML=SCOLORS.map(c=>
    `<button data-act="color" data-c="${c.id}" style="background:${c.hex}" aria-label="${c.label}"></button>`).join("");
});
function senkaiBg(cids){
  const sel=SCOLORS.filter(c=>cids.includes(c.id));
  if(sel.length===0)return"var(--gray)";
  if(sel.length===1)return sel[0].hex;
  return`linear-gradient(135deg, ${sel.map(c=>c.hex).join(", ")})`;
}
function renderSenkai(){
  const p2=state.senkai.p2;
  $("#senkaiB").hidden=!p2;
  $("#senkaiDiv").hidden=!p2;
  $("#senkai2p").textContent=p2?"２Pモード解除":"２Pモード";
  $("#senkai2p").classList.toggle("accent",p2);
  ["a","b"].forEach(side=>{
    const zone=$(`#senkai .zone[data-side="${side}"]`);
    const s=state.senkai[side];
    const val=$(".sval",zone);
    val.textContent=s.v;
    val.style.background=senkaiBg(s.c);
    val.classList.toggle("on-light",s.c.length===1&&s.c[0]==="white");
    $$(".colorbar button",zone).forEach(b=>b.classList.toggle("sel",s.c.includes(b.dataset.c)));
  });
}
$("#senkai").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const zone=b.closest(".zone");if(!zone)return;
  const s=state.senkai[zone.dataset.side];
  if(b.dataset.act==="inc")s.v++;
  else if(b.dataset.act==="dec")s.v=Math.max(0,s.v-1);
  else if(b.dataset.act==="color"){
    const c=b.dataset.c;
    s.c=s.c.includes(c)?s.c.filter(x=>x!==c):[...s.c,c];
  }
  else if(b.dataset.act==="zreset"){s.v=1;s.c=[];}
  save();renderSenkai();
});
$("#senkai2p").addEventListener("click",()=>{
  state.senkai.p2=!state.senkai.p2;
  if(state.senkai.p2)state.senkai.b={v:1,c:[]};
  save();renderSenkai();
});

/* ================= 共通: 時間表示 ================= */
const fmt=ms=>{
  const s=Math.max(0,Math.ceil(ms/1000));
  return`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
};
const THRESHOLDS=[300,180,60];

/* ================= タイマー ================= */
let tRun=false,tEnd=0,tRem=state.timer.min*60000,tPrevSec=Infinity,tInt=null;
function renderTimerTime(){
  const el=$("#timerTime");
  el.textContent=fmt(tRem);
  el.classList.toggle("warn",tRem<=60000);
  $("#timerState").textContent=tRem<=0?"時間切れ":(tRun?"":"一時停止中");
  if(tRem>0&&!tRun&&tRem===state.timer.min*60000)$("#timerState").textContent="";
}
function timerTick(){
  tRem=tEnd-Date.now();
  const sec=Math.ceil(tRem/1000);
  THRESHOLDS.forEach(t=>{if(tPrevSec>t&&sec<=t)flash(screenFlash,4);});
  tPrevSec=sec;
  if(tRem<=0){tRem=0;pauseTimer();flash(screenFlash,6);}
  renderTimerTime();
}
function startTimer(){
  if(tRem<=0)resetTimer();
  tEnd=Date.now()+tRem;
  tPrevSec=Math.ceil(tRem/1000);
  tRun=true;tInt=setInterval(timerTick,100);
  $("#timerToggle").textContent="一時停止";
  $("#timerSet").classList.add("disabled");
  renderTimerTime();
}
function pauseTimer(){
  if(tInt){clearInterval(tInt);tInt=null;}
  if(tRun){tRem=Math.max(0,tEnd-Date.now());tRun=false;}
  $("#timerToggle").textContent="スタート";
  $("#timerSet").classList.remove("disabled");
  renderTimerTime();
}
function resetTimer(){
  pauseTimer();
  tRem=state.timer.min*60000;tPrevSec=Infinity;
  renderTimerTime();
}
$("#timerToggle").addEventListener("click",()=>{tRun?pauseTimer():startTimer();});
$("#timerReset").addEventListener("click",resetTimer);
function bindMinInput(inputId,rowSel,onChange){
  const inp=$(inputId);
  const apply=()=>{
    let v=Math.round(+inp.value||0);
    v=Math.min(180,Math.max(1,v));
    inp.value=v;onChange(v);
  };
  inp.addEventListener("change",apply);
  $$(rowSel+" [data-act]").forEach(b=>b.addEventListener("click",()=>{
    inp.value=(+inp.value||0)+(b.dataset.act==="min-inc"?1:-1);
    apply();
  }));
}
bindMinInput("#timerMin","#timerSet",v=>{state.timer.min=v;save();resetTimer();});
$("#timerMin").value=state.timer.min;

/* ================= チェスクロック ================= */
let cRun=false,cActive=null,cEnd=0,cInt=null;
let cRem={a:state.chess.min*60000,b:state.chess.min*60000};
let cPrev={a:Infinity,b:Infinity};
let cOver=null;
const czone={a:$("#chessA"),b:$("#chessB")};
const incMs=()=>(state.chess.incMin*60+state.chess.incSec)*1000;
const incLabel=()=>{
  const m=state.chess.incMin,s=state.chess.incSec;
  return(m>0?m+"分":"")+(s>0||m===0?s+"秒":"");
};
function renderChess(){
  ["a","b"].forEach(s=>{
    const z=czone[s];
    $(".ctime",z).textContent=fmt(cRem[s]);
    z.classList.toggle("turn",cRun&&cActive===s);
    let hint="";
    if(cOver===s)hint="時間切れ";
    else if(!cRun&&cActive===null&&cRem.a===state.chess.min*60000&&cRem.b===state.chess.min*60000)hint="スタート後、手番が終わったら自分の側をタップ";
    else if(!cRun)hint="一時停止中";
    else if(cActive===s)hint=state.chess.fischer?`あなたの手番 — タップで交代（+${incLabel()}）`:"あなたの手番 — タップで交代";
    $(".chint",z).textContent=hint;
  });
  $("#chessToggle").textContent=cRun?"一時停止":"スタート";
  $("#chessSet").classList.toggle("disabled",cRun||cActive!==null);
  $("#chessFischer").classList.toggle("accent",state.chess.fischer);
  $("#chessIncSet").hidden=!state.chess.fischer;
  $("#chessIncSet").classList.toggle("disabled",cRun||cActive!==null);
}
function chessTick(){
  if(cActive===null)return;
  cRem[cActive]=cEnd-Date.now();
  const sec=Math.ceil(cRem[cActive]/1000);
  THRESHOLDS.forEach(t=>{if(cPrev[cActive]>t&&sec<=t)flash($(".flash",czone[cActive]),4);});
  cPrev[cActive]=sec;
  if(cRem[cActive]<=0){
    cRem[cActive]=0;cOver=cActive;
    flash($(".flash",czone[cActive]),6);
    pauseChess();
  }
  renderChess();
}
function startChess(){
  if(cOver)return;
  cRun=true;
  if(cActive)cEnd=Date.now()+cRem[cActive];
  if(!cInt)cInt=setInterval(chessTick,100);
  renderChess();
}
function pauseChess(){
  if(cInt){clearInterval(cInt);cInt=null;}
  if(cRun&&cActive)cRem[cActive]=Math.max(0,cEnd-Date.now());
  cRun=false;
  renderChess();
}
function resetChess(){
  pauseChess();
  cRem={a:state.chess.min*60000,b:state.chess.min*60000};
  cPrev={a:Infinity,b:Infinity};
  cActive=null;cOver=null;
  renderChess();
}
["a","b"].forEach(s=>{
  czone[s].addEventListener("click",()=>{
    if(!cRun||cOver)return;
    if(cActive===null||cActive===s){
      if(cActive){
        cRem[cActive]=Math.max(0,cEnd-Date.now());
        if(state.chess.fischer)cRem[cActive]+=incMs();
      }
      cActive=s==="a"?"b":"a";
      cEnd=Date.now()+cRem[cActive];
      cPrev[cActive]=Math.ceil(cRem[cActive]/1000);
      renderChess();
    }
  });
});
$("#chessToggle").addEventListener("click",()=>{cRun?pauseChess():startChess();});
$("#chessReset").addEventListener("click",resetChess);
bindMinInput("#chessMin","#chessSet",v=>{state.chess.min=v;save();resetChess();});
$("#chessMin").value=state.chess.min;
$("#chessFischer").addEventListener("click",()=>{
  state.chess.fischer=!state.chess.fischer;save();renderChess();
});
function bindIncInput(sel,key,max){
  const inp=$(sel);
  inp.value=state.chess[key];
  inp.addEventListener("change",()=>{
    let v=Math.round(+inp.value||0);
    v=Math.min(max,Math.max(0,v));
    inp.value=v;state.chess[key]=v;save();renderChess();
  });
}
bindIncInput("#chessIncMin","incMin",30);
bindIncInput("#chessIncSec","incSec",59);

/* ---------- 初期描画 ---------- */
renderMushi();renderIjin();renderSenkai();resetTimer();resetChess();
})();
</script>
</body>
</html>
